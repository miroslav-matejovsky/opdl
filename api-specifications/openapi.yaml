components:
  schemas:
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          example: Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          nullable: true
          type: array
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          example: https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          example: 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          example: Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          example: https://example.com/errors/example
          format: uri
          type: string
      type: object
    HealthHAResponse:
      additionalProperties: false
      properties:
        leaseExpirationUtc:
          description: Lease expiration timestamp in UTC.
          example: "2026-07-24T10:15:00Z"
          type: string
        leaseState:
          description: "Lease ownership status: Owned or Unowned."
          example: Owned
          type: string
        role:
          description: "Instance role: Primary or Standby."
          example: Primary
          type: string
        runtimeState:
          description: "Current runtime state: Active or Passive."
          example: Active
          type: string
      required:
        - role
        - runtimeState
        - leaseState
      type: object
    HealthLiveResponse:
      additionalProperties: false
      properties:
        status:
          description: Process liveness status.
          example: Healthy
          type: string
      required:
        - status
      type: object
    HealthReadyResponse:
      additionalProperties: false
      properties:
        status:
          description: Operational readiness status.
          example: Healthy
          type: string
      required:
        - status
      type: object
    HealthResponse:
      additionalProperties: false
      properties:
        checks:
          additionalProperties:
            type: string
          description: Dependency health check results.
          type: object
        instanceId:
          description: Instance identifier.
          example: Primary
          type: string
        role:
          description: "Instance role: Primary or Standby."
          example: Primary
          type: string
        runtimeState:
          description: "Current runtime state: Active or Passive."
          example: Active
          type: string
        status:
          description: "Overall health status: Healthy, Degraded, or Unhealthy."
          example: Healthy
          type: string
        uptime:
          description: Human-readable process uptime.
          example: 14d 07h 23m
          type: string
        version:
          description: Platform runtime version.
          example: 0.1.0
          type: string
      required:
        - status
        - instanceId
        - role
        - runtimeState
        - version
        - uptime
      type: object
    Instance:
      additionalProperties: false
      properties:
        address:
          description: This instance's own loopback API address.
          example: 127.0.0.1:8080
          type: string
        machine:
          description: Descriptor machine this instance runs on.
          example: local-server
          type: string
        peer_address:
          description: The machine's other instance's API address, if one is deployed.
          example: 127.0.0.1:8081
          type: string
        role:
          description: "Fixed build-time instance role: primary or standby."
          example: primary
          type: string
        state:
          description: "Current runtime state: active or passive."
          example: active
          type: string
      required:
        - machine
        - role
        - state
        - address
      type: object
    ServiceHealthCount:
      additionalProperties: false
      properties:
        count:
          description: How many times it has happened.
          example: 3
          format: int64
          type: integer
        reason:
          description: Why the message was not applied.
          example: stale
          type: string
      required:
        - reason
        - count
      type: object
    ServiceHealthDistribution:
      additionalProperties: false
      properties:
        delivered:
          description: Messages received on the health subject.
          example: 240
          format: int64
          type: integer
        dropped:
          description: Decoded reports the view did not apply, by reason.
          items:
            $ref: "#/components/schemas/ServiceHealthCount"
          nullable: true
          type: array
        publishFailed:
          description: Observations the connection refused.
          example: 0
          format: int64
          type: integer
        published:
          description: Observations from this instance that reached the connection.
          example: 120
          format: int64
          type: integer
        rejected:
          description: Messages rejected before decoding, by reason.
          items:
            $ref: "#/components/schemas/ServiceHealthCount"
          nullable: true
          type: array
        state:
          description: "Whether expected remote observations are arriving: Connected, Partial, Isolated, or Local."
          example: Connected
          type: string
        superseded:
          description: Observations replaced by a newer one before being sent.
          example: 0
          format: int64
          type: integer
      required:
        - state
        - published
        - superseded
        - publishFailed
        - delivered
        - rejected
        - dropped
      type: object
    ServiceHealthObservation:
      additionalProperties: false
      properties:
        ageMs:
          description: Milliseconds since this report arrived, on the answering instance's clock.
          example: 1200
          format: int64
          type: integer
        checkedAtUtc:
          description: When the observer says it probed, in UTC.
          example: "2026-07-28T11:59:58Z"
          type: string
        consecutiveFailures:
          description: Attempts that had failed in a row when the observer reported.
          example: 0
          format: int64
          type: integer
        error:
          description: Why the observer's probe failed, absent when it succeeded.
          type: string
        latencyMs:
          description: Milliseconds the observer's probe took.
          example: 4
          format: int64
          type: integer
        observerRole:
          description: "Platform instance role that reported: primary or standby."
          example: primary
          type: string
        receivedAtUtc:
          description: When this instance received the report, in UTC.
          example: "2026-07-28T11:59:58Z"
          type: string
        stale:
          description: Whether this report has passed the service's freshness bound.
          example: false
          type: boolean
        status:
          description: "Status this observer reported: Healthy, Unhealthy, or Unknown."
          example: Healthy
          type: string
      required:
        - observerRole
        - status
        - stale
        - checkedAtUtc
        - receivedAtUtc
        - ageMs
        - latencyMs
        - consecutiveFailures
      type: object
    ServiceHealthResponse:
      additionalProperties: false
      properties:
        distribution:
          $ref: "#/components/schemas/ServiceHealthDistribution"
          description: State of this instance's site health traffic.
        environment:
          description: Environment this view covers.
          example: production
          type: string
        generatedAtUtc:
          description: When this snapshot was taken, in UTC.
          example: "2026-07-28T12:00:00Z"
          type: string
        machine:
          description: Machine of the instance that produced this view.
          example: local-server
          type: string
        project:
          description: Project this view covers.
          example: customer-a
          type: string
        role:
          description: "Fixed instance role that produced this view: primary or standby."
          example: primary
          type: string
        services:
          description: Every service at this site, in inventory order.
          items:
            $ref: "#/components/schemas/ServiceHealthUnit"
          nullable: true
          type: array
        site:
          description: Site this view covers.
          example: north
          type: string
        summary:
          $ref: "#/components/schemas/ServiceHealthSummary"
          description: Service counts by status.
      required:
        - project
        - environment
        - site
        - machine
        - role
        - generatedAtUtc
        - summary
        - services
        - distribution
      type: object
    ServiceHealthSummary:
      additionalProperties: false
      properties:
        degraded:
          description: Services whose current observers disagree.
          example: 0
          format: int64
          type: integer
        healthy:
          description: Services every current observer found well.
          example: 2
          format: int64
          type: integer
        unhealthy:
          description: Services every current observer found failing.
          example: 1
          format: int64
          type: integer
        unknown:
          description: Services nothing current says anything about.
          example: 1
          format: int64
          type: integer
      required:
        - healthy
        - unhealthy
        - degraded
        - unknown
      type: object
    ServiceHealthUnit:
      additionalProperties: false
      properties:
        expectedObservers:
          description: Platform instance roles expected to report on this service.
          example:
            - primary
            - standby
          items:
            type: string
          nullable: true
          type: array
        machine:
          description: Machine hosting this service.
          example: local-server
          type: string
        machineProfile:
          description: Purpose of the hosting machine.
          example: local-server
          type: string
        missingObservers:
          description: Expected observers that have never reported.
          items:
            type: string
          nullable: true
          type: array
        observations:
          description: Last report from each observer, ordered by observer role.
          items:
            $ref: "#/components/schemas/ServiceHealthObservation"
          nullable: true
          type: array
        service:
          description: Service name.
          example: alarm-service
          type: string
        serviceRole:
          description: "Part this copy plays: master or slave."
          example: master
          type: string
        staleObservers:
          description: Expected observers whose last report has expired.
          items:
            type: string
          nullable: true
          type: array
        status:
          description: "Reduced service status: Healthy, Unhealthy, Degraded, or Unknown."
          example: Healthy
          type: string
      required:
        - machine
        - machineProfile
        - service
        - serviceRole
        - status
        - expectedObservers
        - missingObservers
        - staleObservers
        - observations
      type: object
info:
  description: HTTP API served by the OPDL platform runtime.
  title: OPDL Platform API
  version: 0.1.0
openapi: 3.0.3
paths:
  /health:
    get:
      description: Overall health assessment, operational status, dependency status, readiness, and basic redundancy visibility.
      operationId: getHealth
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Report primary operational health
  /health/ha:
    get:
      description: Redundancy, lease, and primary ownership diagnostics.
      operationId: getHealthHA
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthHAResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Report high-availability and ownership diagnostics
  /health/live:
    get:
      description: Lightweight check determining whether the process and main execution loop are running.
      operationId: getHealthLive
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthLiveResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Report process liveness
  /health/ready:
    get:
      description: Check determining whether the instance is capable of serving work.
      operationId: getHealthReady
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReadyResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Report operational readiness
  /health/services:
    get:
      description: Every service the site deploys, what each observer last found, and whether those findings are current. Answered by every instance in every state, from memory. Unhealthy, Degraded, and Unknown services are data rather than a failure to answer, so this returns 200 for every valid view.
      operationId: getHealthServices
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceHealthResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Report this instance's view of the site's deployed services
  /instance:
    get:
      description: Answered by every instance in every state, including a Passive one that refuses every domain operation.
      operationId: getInstance
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Report this instance's identity and state
