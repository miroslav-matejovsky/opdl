openapi: 3.0.3
info:
    title: OPDL Platform API
    version: 0.1.0
    description: HTTP API served by the OPDL platform runtime.
paths:
    /registrations:
        get:
            operationId: listRegistrations
            summary: List registration requests
            responses:
                "200":
                    description: List registration requests
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/Registration'
                "500":
                    description: List registration requests
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
        post:
            operationId: registerUnit
            summary: Request unit registration
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RegistrationRequest'
            responses:
                "202":
                    description: Request unit registration
                "400":
                    description: Request unit registration
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                "409":
                    description: Request unit registration
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                "500":
                    description: Request unit registration
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /registrations/{unit_type}/{unit_id}/status:
        get:
            operationId: getRegistrationStatus
            summary: Get registration request status
            parameters:
                - name: unit_type
                  in: path
                  required: true
                  schema:
                    type: integer
                    format: int32
                    minimum: 0
                    maximum: 255
                - name: unit_id
                  in: path
                  required: true
                  schema:
                    type: integer
                    format: int32
                    minimum: 0
                    maximum: 65535
            responses:
                "200":
                    description: Get registration request status
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Registration'
                "404":
                    description: Get registration request status
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                "500":
                    description: Get registration request status
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /registrations/conflicts:
        get:
            operationId: listRegistrationConflicts
            summary: List resolved registration conflicts
            responses:
                "200":
                    description: List resolved registration conflicts
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/RegistrationConflict'
                "500":
                    description: List resolved registration conflicts
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
components:
    schemas:
        Error:
            type: object
            properties:
                code:
                    type: string
            required:
                - code
        PlatformInstanceRegistrationStatus:
            type: object
            properties:
                ip:
                    type: string
                machine:
                    type: string
                reason:
                    type: string
                    nullable: true
                status:
                    type: string
            required:
                - ip
                - machine
                - status
        Registration:
            type: object
            properties:
                ip:
                    type: string
                machine:
                    type: string
                platform_instances:
                    type: array
                    items:
                        $ref: '#/components/schemas/PlatformInstanceRegistrationStatus'
                reason:
                    type: string
                    nullable: true
                role:
                    type: string
                    nullable: true
                status:
                    type: string
                unit_id:
                    type: integer
                    format: int32
                    minimum: 0
                    maximum: 65535
                unit_type:
                    type: integer
                    format: int32
                    minimum: 0
                    maximum: 255
                unit_type_name_advertised:
                    type: string
            required:
                - ip
                - machine
                - platform_instances
                - status
                - unit_id
                - unit_type
                - unit_type_name_advertised
        RegistrationConflict:
            type: object
            properties:
                losers:
                    type: array
                    items:
                        $ref: '#/components/schemas/Registration'
                resolution_status:
                    type: string
                unit_id:
                    type: integer
                    format: int32
                    minimum: 0
                    maximum: 65535
                unit_type:
                    type: integer
                    format: int32
                    minimum: 0
                    maximum: 255
                winner:
                    $ref: '#/components/schemas/Registration'
            required:
                - losers
                - resolution_status
                - unit_id
                - unit_type
                - winner
        RegistrationRequest:
            type: object
            properties:
                role:
                    type: string
                    nullable: true
                unit_id:
                    type: integer
                    format: int32
                    minimum: 0
                    maximum: 65535
                unit_type:
                    type: integer
                    format: int32
                    minimum: 0
                    maximum: 255
                unit_type_name_advertised:
                    type: string
            required:
                - unit_id
                - unit_type
                - unit_type_name_advertised
