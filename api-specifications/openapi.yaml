components:
  schemas:
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          example: Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          nullable: true
          type: array
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          example: https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          example: 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          example: Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          example: https://example.com/errors/example
          format: uri
          type: string
      type: object
    Instance:
      additionalProperties: false
      properties:
        address:
          description: This instance's own loopback API address.
          example: 127.0.0.1:8080
          type: string
        machine:
          description: Descriptor machine this instance runs on.
          example: local-server
          type: string
        peer_address:
          description: The machine's other instance's API address, if one is deployed.
          example: 127.0.0.1:8081
          type: string
        role:
          description: "Fixed build-time instance role: primary or standby."
          example: primary
          type: string
        state:
          description: "Current runtime state: active or passive."
          example: active
          type: string
      required:
        - machine
        - role
        - state
        - address
      type: object
    PlatformInstanceRegistrationStatus:
      additionalProperties: false
      properties:
        ip:
          description: Platform instance's descriptor IP, empty when the deployment no longer has the machine.
          example: 10.0.0.21
          type: string
        machine:
          description: Platform instance's descriptor machine.
          example: node-a
          type: string
        reason:
          description: Optional machine-readable rejection code.
          example: registration_key_conflict
          type: string
        status:
          description: "Platform instance's registration status: pending, accepted, or rejected."
          example: accepted
          type: string
      required:
        - machine
        - ip
        - status
      type: object
    ProposalAccepted:
      additionalProperties: false
      properties:
        proposal_id:
          description: Stable proposal identity and status key.
          example: c1a2b3
          type: string
        sequence:
          description: Proposal position in the site journal.
          example: 12
          format: int64
          minimum: 0
          type: integer
      required:
        - proposal_id
        - sequence
      type: object
    Registration:
      additionalProperties: false
      properties:
        ip:
          description: Descriptor IP where the request originated.
          example: 10.0.0.11
          type: string
        machine:
          description: Descriptor machine where the request originated.
          example: site-1
          type: string
        platform_instances:
          description: Deterministic progress view for each platform instance.
          items:
            $ref: "#/components/schemas/PlatformInstanceRegistrationStatus"
          nullable: true
          type: array
        proposal_id:
          description: Stable proposal identity and status key.
          example: c1a2b3
          type: string
        reason:
          description: Optional machine-readable rejection code.
          example: registration_key_conflict
          type: string
        role:
          description: Optional Master or Slave role advertised by the unit.
          example: Master
          type: string
        status:
          description: "Registration status: pending, accepted, or rejected."
          example: accepted
          type: string
        unit_id:
          description: Registered unit identifier.
          example: 42
          format: int32
          maximum: 65535
          minimum: 0
          type: integer
        unit_type:
          description: Registered unit type identifier.
          example: 7
          format: int32
          maximum: 255
          minimum: 0
          type: integer
        unit_type_name_advertised:
          description: Advertised unit type name.
          example: Billing
          type: string
      required:
        - proposal_id
        - unit_type
        - unit_id
        - unit_type_name_advertised
        - machine
        - ip
        - status
        - platform_instances
      type: object
    RegistrationConflict:
      additionalProperties: false
      properties:
        losers:
          description: Competing proposals rejected with registration_key_conflict.
          items:
            $ref: "#/components/schemas/Registration"
          nullable: true
          type: array
        resolution_status:
          description: Resolution status of the conflict, resolved when the winner is the deterministic survivor.
          example: resolved
          type: string
        unit_id:
          description: Unit identifier shared by all competing proposals.
          example: 42
          format: int32
          maximum: 65535
          minimum: 0
          type: integer
        unit_type:
          description: Unit type identifier shared by all competing proposals.
          example: 7
          format: int32
          maximum: 255
          minimum: 0
          type: integer
        winner:
          $ref: "#/components/schemas/Registration"
          description: Proposal that remains the registration for this unit key.
      required:
        - unit_type
        - unit_id
        - resolution_status
        - winner
        - losers
      type: object
    RegistrationRequest:
      additionalProperties: false
      properties:
        role:
          description: Optional Master or Slave role advertised by the unit.
          example: Master
          type: string
        unit_id:
          description: Unit identifier, 0 through 65535.
          example: 42
          format: int32
          maximum: 65535
          minimum: 0
          type: integer
        unit_type:
          description: Unit type identifier, 0 through 255.
          example: 7
          format: int32
          maximum: 255
          minimum: 0
          type: integer
        unit_type_name_advertised:
          description: Advertised unit type name. Required and non-blank.
          example: Billing
          type: string
      required:
        - unit_type
        - unit_id
        - unit_type_name_advertised
      type: object
info:
  description: HTTP API served by the OPDL platform runtime.
  title: OPDL Platform API
  version: 0.1.0
openapi: 3.0.3
paths:
  /instance:
    get:
      description: Answered by every instance in every state, including a Passive one that refuses every domain operation.
      operationId: getInstance
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Report this instance's identity and state
  /registrations:
    get:
      operationId: listRegistrations
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Registration"
                nullable: true
                type: array
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List registration proposals
    post:
      operationId: registerUnit
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationRequest"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalAccepted"
          description: Accepted
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      summary: Propose a unit registration
  /registrations/conflicts:
    get:
      operationId: listRegistrationConflicts
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/RegistrationConflict"
                nullable: true
                type: array
          description: OK
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: List resolved registration conflicts
  /registrations/{proposal_id}:
    get:
      operationId: getRegistrationStatus
      parameters:
        - description: Opaque proposal identifier returned by registerUnit.
          in: path
          name: proposal_id
          required: true
          schema:
            description: Opaque proposal identifier returned by registerUnit.
            example: c1a2b3
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Registration"
          description: OK
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Get a registration proposal's status
