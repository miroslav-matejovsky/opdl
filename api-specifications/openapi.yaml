components:
  schemas:
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          example: Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          nullable: true
          type: array
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          example: https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          example: 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          example: Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          example: https://example.com/errors/example
          format: uri
          type: string
      type: object
    HealthHAResponse:
      additionalProperties: false
      properties:
        leaseExpirationUtc:
          description: Lease expiration timestamp in UTC.
          example: "2026-07-24T10:15:00Z"
          type: string
        leaseState:
          description: "Lease ownership status: Owned or Unowned."
          example: Owned
          type: string
        role:
          description: "Instance role: Primary or Standby."
          example: Primary
          type: string
        runtimeState:
          description: "Current runtime state: Active or Passive."
          example: Active
          type: string
      required:
        - role
        - runtimeState
        - leaseState
      type: object
    HealthLiveResponse:
      additionalProperties: false
      properties:
        status:
          description: Process liveness status.
          example: Healthy
          type: string
      required:
        - status
      type: object
    HealthReadyResponse:
      additionalProperties: false
      properties:
        status:
          description: Operational readiness status.
          example: Healthy
          type: string
      required:
        - status
      type: object
    HealthResponse:
      additionalProperties: false
      properties:
        checks:
          additionalProperties:
            type: string
          description: Dependency health check results.
          type: object
        instanceId:
          description: Instance identifier.
          example: Primary
          type: string
        role:
          description: "Instance role: Primary or Standby."
          example: Primary
          type: string
        runtimeState:
          description: "Current runtime state: Active or Passive."
          example: Active
          type: string
        status:
          description: "Overall health status: Healthy, Degraded, or Unhealthy."
          example: Healthy
          type: string
        uptime:
          description: Human-readable process uptime.
          example: 14d 07h 23m
          type: string
        version:
          description: Platform runtime version.
          example: 0.1.0
          type: string
      required:
        - status
        - instanceId
        - role
        - runtimeState
        - version
        - uptime
      type: object
    Instance:
      additionalProperties: false
      properties:
        address:
          description: This instance's own loopback API address.
          example: 127.0.0.1:8080
          type: string
        machine:
          description: Descriptor machine this instance runs on.
          example: local-server
          type: string
        peer_address:
          description: The machine's other instance's API address, if one is deployed.
          example: 127.0.0.1:8081
          type: string
        role:
          description: "Fixed build-time instance role: primary or standby."
          example: primary
          type: string
        state:
          description: "Current runtime state: active or passive."
          example: active
          type: string
      required:
        - machine
        - role
        - state
        - address
      type: object
info:
  description: HTTP API served by the OPDL platform runtime.
  title: OPDL Platform API
  version: 0.1.0
openapi: 3.0.3
paths:
  /health:
    get:
      description: Overall health assessment, operational status, dependency status, readiness, and basic redundancy visibility.
      operationId: getHealth
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Report primary operational health
  /health/ha:
    get:
      description: Redundancy, lease, and primary ownership diagnostics.
      operationId: getHealthHA
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthHAResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Report high-availability and ownership diagnostics
  /health/live:
    get:
      description: Lightweight check determining whether the process and main execution loop are running.
      operationId: getHealthLive
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthLiveResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Report process liveness
  /health/ready:
    get:
      description: Check determining whether the instance is capable of serving work.
      operationId: getHealthReady
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReadyResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Report operational readiness
  /instance:
    get:
      description: Answered by every instance in every state, including a Passive one that refuses every domain operation.
      operationId: getInstance
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Report this instance's identity and state
