version: 3

workdir: .

allow:
  depOnAnyVendor: false
  deepScan: true

exclude:
  - ".gocache"
  - ".lintcache"
  - ".test-results"

excludeFiles:
  - "^.*_test\\.go$"

vendors:
  toml: { in: "github.com/BurntSushi/toml**" }
  huma: { in: "github.com/danielgtaylor/huma/v2**" }
  nats-server: { in: "github.com/nats-io/nats-server/v2/**" }
  nats-client: { in: "github.com/nats-io/nats.go**" }
  sys: { in: "golang.org/x/sys/**" }
  atomicfile: { in: "github.com/miroslav-matejovsky/opdl/utils/atomicfile" }
  winmutex: { in: "github.com/miroslav-matejovsky/opdl/utils/winmutex" }
  stablehash: { in: "github.com/miroslav-matejovsky/opdl/utils/stablehash" }

components:
  api: { in: api }
  cmd: { in: cmd }
  config: { in: config }
  app: { in: internal/app }
  events: { in: internal/events }
  events-storage: { in: internal/events/storage }
  events-storage-jsonl: { in: internal/events/storage/jsonl }
  eventfabric: { in: internal/eventfabric }
  eventfabric-nats: { in: internal/eventfabric/nats }
  httpapi: { in: internal/httpapi }
  operations: { in: internal/operations }
  redundancy: { in: internal/redundancy }
  registration: { in: internal/registration }

deps:
  api:
    canUse: [huma]
  cmd:
    mayDependOn: [app]
  app:
    # api is here because composition is what knows which instance this process
    # is: it fills the instance identity both the Active and the Passive handler
    # serve. The domain operations stay behind httpapi.
    #
    # events is here because composition is also what knows which process this
    # is: it builds the one envelope factory that stamps every event this node
    # states, and hands out only the publisher composed from it.
    mayDependOn: [api, config, eventfabric, eventfabric-nats, events, events-storage, events-storage-jsonl, httpapi, operations, redundancy, registration]
  redundancy:
    canUse: [sys, atomicfile, winmutex]
    # Ownership transitions are events in their own right: which instance became
    # Active, when, and whether it took over from a process that died. The
    # package that runs the transitions is the one that can report them
    # accurately, so it declares and states them itself rather than returning
    # them for a caller to describe.
    mayDependOn: [events, operations]
  # config is a leaf. It carries both tiers of configuration — the deployment
  # descriptor compiled in at build time and the TOML file read at startup — so
  # the packages below depend on it for the machine's identity and topology, and
  # it depends on none of them.
  config:
    canUse: [toml]
  events:
    mayDependOn: [config]
  events-storage:
    mayDependOn: [events]
  events-storage-jsonl:
    mayDependOn: [events, events-storage]
  eventfabric:
    canUse: [stablehash]
    mayDependOn: [events]
  eventfabric-nats:
    canUse: [nats-server, nats-client]
    mayDependOn: [config, events, eventfabric, operations]

  # operations is the local event writer: it stamps typed payloads with the
  # process's envelope factory and serializes them. It owns no events.
  operations:
    mayDependOn: [events]
  httpapi:
    canUse: [huma]
    mayDependOn: [api, registration]
  registration:
    canUse: [stablehash]
    mayDependOn: [api, events, eventfabric]
