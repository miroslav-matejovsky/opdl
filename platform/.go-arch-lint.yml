version: 3

workdir: .

allow:
  depOnAnyVendor: false
  deepScan: true

exclude:
  - ".gocache"
  - ".lintcache"
  - ".test-results"

excludeFiles:
  - "^.*_test\\.go$"

vendors:
  toml: { in: "github.com/BurntSushi/toml**" }
  huma: { in: "github.com/danielgtaylor/huma/v2**" }
  nats-server: { in: "github.com/nats-io/nats-server/v2/**" }
  nats-client: { in: "github.com/nats-io/nats.go**" }
  sys: { in: "golang.org/x/sys/**" }
  atomicfile: { in: "github.com/miroslav-matejovsky/opdl/utils/atomicfile" }
  winmutex: { in: "github.com/miroslav-matejovsky/opdl/utils/winmutex" }
  stablehash: { in: "github.com/miroslav-matejovsky/opdl/utils/stablehash" }

components:
  api: { in: api }
  cmd: { in: cmd }
  deployment: { in: deployment }
  embedded: { in: embedded }
  app: { in: internal/app }
  config: { in: internal/config }
  events: { in: internal/events }
  eventfabric: { in: internal/eventfabric }
  eventfabric-nats: { in: internal/eventfabric/nats }
  httpapi: { in: internal/httpapi }
  operations: { in: internal/operations }
  redundancy: { in: internal/redundancy }
  registration: { in: internal/registration }

deps:
  api:
    canUse: [huma]
  cmd:
    mayDependOn: [app]
  embedded:
    mayDependOn: [deployment]
  app:
    mayDependOn: [config, deployment, eventfabric, eventfabric-nats, httpapi, operations, redundancy, registration]
  redundancy:
    canUse: [sys, atomicfile, winmutex]
  config:
    canUse: [toml]
    mayDependOn: [deployment, embedded]
  events:
    mayDependOn: [deployment]
  eventfabric:
    canUse: [stablehash]
    mayDependOn: [events]
  eventfabric-nats:
    canUse: [nats-server, nats-client]
    mayDependOn: [deployment, events, eventfabric, operations]

  operations:
    mayDependOn: [deployment]
  httpapi:
    canUse: [huma]
    mayDependOn: [api, registration]
  registration:
    canUse: [stablehash]
    mayDependOn: [api, events, eventfabric]
