version: 3

workdir: .

allow:
  depOnAnyVendor: false
  deepScan: true

exclude:
  - ".gocache"
  - ".lintcache"
  - ".test-results"

excludeFiles:
  - "^.*_test\\.go$"

vendors:
  huma: { in: "github.com/danielgtaylor/huma/v2**" }
  atomicfile: { in: "github.com/miroslav-matejovsky/opdl/utils/atomicfile" }
  # The two halves of NATS are separate vendors so the rule below can say what
  # the split is: the instance level embeds the broker, and only the site level
  # holds a client of it.
  natsbroker: { in: "github.com/nats-io/nats-server/v2/server" }
  natsclient: { in: "github.com/nats-io/nats.go" }

components:
  api: { in: api }
  cmd: { in: cmd }
  config: { in: config }
  app: { in: internal/app }
  events: { in: internal/events }
  events-storage: { in: internal/events/storage }
  applog: { in: internal/instance/applog }
  eventlog: { in: internal/instance/eventlog }
  natsserver: { in: internal/instance/natsserver }
  httpapi: { in: internal/httpapi }
  state: { in: internal/instance/state }
  redundancy: { in: internal/machine/redundancy }
  eventstore: { in: internal/machine/eventstore }
  servicehealth: { in: internal/machine/servicehealth }
  eventfabric: { in: internal/site/eventfabric }

deps:
  api:
    canUse: [huma]
  cmd:
    mayDependOn: [app]
  app:
    # api is here because composition is what knows which instance this process
    # is: it fills the instance identity both the Active and the Passive handler
    # serve. The domain operations stay behind httpapi.
    #
    # events is here because composition is also what knows which process this
    # is: it builds the one envelope factory that stamps every event this node
    # states, and hands out only the publisher composed from it.
    #
    # state is here for the same reason: composition is what knows this
    # process is a new incarnation of the instance, so it opens the state file
    # and advances the epoch. Nothing below app reads or writes it.
    #
    # natsserver and eventfabric are here because the two halves of the event
    # fabric belong to different levels and only composition knows both: the
    # instance's broker is started here and the site's client is opened onto it
    # here, and nothing below is given either of them whole.
    #
    # servicehealth is here because the adapter between the descriptor and a
    # probe belongs to composition: it is what knows the machine's ip, and what
    # decides that monitoring runs for the whole process rather than for an
    # activation. The monitor itself reads no descriptor.
    mayDependOn: [api, applog, config, events, events-storage, eventfabric, eventlog, eventstore, httpapi, natsserver, redundancy, servicehealth, state]
  # applog has no entry here on purpose, for the same reason config has none: it
  # is a leaf. It is one local file behind log/slog, holding no descriptor and
  # stating no event. The composition root opens it, stamps the process identity
  # on it, and hands the runtime a logger; everything below the root reaches its
  # records through slog's default logger rather than by importing it.
  state:
    # A leaf over one local file. It states no event and reads no descriptor, so
    # the component that advances the epoch is the one that also reports it.
    canUse: [atomicfile]
  redundancy:
    canUse: [atomicfile]
    # Ownership transitions are events in their own right: which instance became
    # Active, when, and whether it took over from a process that died. The
    # package that runs the transitions is the one that can report them
    # accurately, so it declares and states them itself rather than returning
    # them for a caller to describe.
    mayDependOn: [events]
  # config has no entry here on purpose. It is a leaf: it carries the deployment
  # descriptor compiled in at build time, which is the whole of a binary's
  # configuration, so the components below depend on it for the machine's
  # identity and topology while it depends on nothing, not even a vendor. It used
  # to declare canUse: [toml] for the runtime configuration file, which no longer
  # exists.
  events:
    mayDependOn: [config]
  events-storage:
    mayDependOn: [events]
  eventlog:
    mayDependOn: [events, events-storage]
  httpapi:
    canUse: [huma]
    mayDependOn: [api]
  eventstore:
    # The machine level's own store. It depends on the envelope it holds and on
    # the backend contract that puts it behind a publisher, and on nothing else:
    # it is a store, so it must not know which domain wrote what it stores.
    mayDependOn: [events, events-storage]
  natsserver:
    # The instance level's embedded broker. It depends on the NATS server
    # library and on nothing of ours: it holds no descriptor, states no event,
    # and knows nothing about what is published through it. The composition root
    # reads the descriptor and hands it a configuration.
    canUse: [natsbroker]
  # servicehealth has no entry here on purpose. It probes the machine's services
  # and hands the results to an injected sink, so it depends on nothing of ours:
  # it reads no descriptor, holds no transport, and states no event. The
  # composition root reads the descriptor, resolves each service onto a request
  # URL, and decides where the observations go. That is what keeps target
  # service health out of the platform's own health and out of ownership.
  eventfabric:
    # The site level holds the client and never the broker. natsbroker is
    # deliberately absent: a site package that could start a server would put
    # instance-level infrastructure at the wrong level, and the in-process
    # connection it needs is named as a local interface instead.
    canUse: [natsclient]
    mayDependOn: [events]
