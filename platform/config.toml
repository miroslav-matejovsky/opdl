# OPDL Platform Runtime Configuration
#
# This file configures the runtime settings for an individual OPDL platform instance.
# All required runtime settings must be explicitly specified; the runtime does not apply implicit defaults.
# A user may modify runtime settings without rebuilding the binary or touching the
# embedded deployment descriptor.

# The host:port address where the platform serves its public registration HTTP API.
address = "127.0.0.1:8080"

# Maximum duration allowed for reading HTTP request headers before closing the connection.
read_header_timeout = "5s"

# Maximum duration allowed for graceful server and Event Fabric shutdown when terminating in-flight requests.
shutdown_timeout = "10s"

# Local runtime directory holding this machine's fence and per-process status
# files. Required. The primary and standby share it, and it must be on a
# local filesystem so the OS lock is dropped on process death and enforced
# exclusively. It is not the journal store: it carries local coordination and
# diagnostics, not site history.
instance_dir = ".data/instance"

# Required bound on how long a process's projection may lag the journal before it
# stops being promotable, and before an active process stops serving rather than
# answering from a stale view. This provisional value is an operational safety
# bound, not a failover-time SLO.
lag_bound = "30s"

[operations]
# Optional directory for append-only operational JSONL files. The platform
# always writes the same structured events to stderr for capture by the service
# manager. Leave event_dir empty to rely on that log stream only.
event_dir = ".data/operations"

[event_fabric.nats]
# Directory holding the site journal's JetStream file store. Required.
#
# The platform creates a subdirectory named after this machine's deployment
# identity and never deletes it. Disk capacity and backup belong to site
# operations. A copied store must not be restored into two live servers with the
# same server identity: both would claim the same journal.
data_dir = ".data/nats"

# Maximum duration allowed for the embedded NATS server to become ready for connections.
startup_timeout = "30s"

# Maximum duration allowed for the complete startup readiness sequence: replaying
# the retained journal into this node's projections, draining its durable
# handlers' retained work, and recording that the node is ready. The platform
# does not serve its API until that finishes, and does not start if it cannot.
catch_up_timeout = "30s"

# Path to a TOML file holding the site's NATS credentials as `username` and
# `password` keys. Required for any deployment that binds a non-loopback address;
# a loopback-only deployment (development, scenarios) may omit it. It is a
# separate file so a site can hold it at different permissions, and its contents
# are never logged.
# credentials_file = "/etc/opdl/nats-credentials.toml"

# There are no socket settings here. The Event Fabric's client and cluster
# addresses, routes, and server list are deployment topology: they are authored
# as ports in the project blueprint and resolved into the embedded deployment
# descriptor. Setting them at a site could point a machine at a journal that is
# not its own, so this file cannot.
#
# Unknown keys are rejected at load time. A setting this schema does not define
# is an error rather than a value that is silently ignored, because a silently
# ignored setting is indistinguishable from an applied one.
