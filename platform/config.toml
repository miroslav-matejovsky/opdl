# OPDL Platform Runtime Configuration
#
# The embedded deployment descriptor is the source of truth for process identity
# and production endpoints. This file contains common runtime settings and a
# controlled fallback for exceptional endpoint corrections in production.
# All required common settings must be explicitly specified.

# Directory path where domain events (`platform.registration.*`, `platform.fabric.*`) are recorded
# in JSONL format. If set to an empty string (""), event recording is disabled.
events_dir = ""

# Maximum duration allowed for reading HTTP request headers before closing the connection.
read_header_timeout = "5s"

# Maximum duration allowed for graceful server and fabric shutdown when terminating in-flight requests.
shutdown_timeout = "10s"

[registration]
# Frequency at which the background reconciler scans and repairs site registration records.
reconcile_interval = "1s"

[fabric.olric]
# Maximum duration allowed for the Olric memberlist join and initialization at startup.
start_timeout = "30s"

# Maximum duration allowed for tearing down the Olric instance during shutdown.
shutdown_grace = "10s"

# Optional overrides are scoped to one descriptor instance. Omitted values use
# the embedded descriptor. These examples are intentionally commented out.
# [instances.primary]
# api_address = "127.0.0.1:9080"
# [instances.primary.fabric.olric]
# client_address = "127.0.0.1:4320"
# memberlist_address = "127.0.0.1:4322"
# join = ["127.0.0.2:3322"]
