version: "2"
run:
  # 15m headroom: a cold compile of the nuclei SDK dependency graph (~500 modules,
  # pulled in by internal/tools/nucleiscan) can exceed the old 5m on a clean build
  # cache, which `task all` triggers via `clean` before lint.
  timeout: 15m

linters:
  default: standard
  enable:
    - staticcheck
    - errcheck
    - errorlint
    - nilnil
    - copyloopvar
    - depguard      # level dependency rule of the Site -> Machine -> Instance hierarchy
    - gocyclo
    - exhaustive    # exhaustive handling of enum values in switch/select
    - goconst       # repeated string literals that should be constants
    - gocritic      # opinionated style, performance, and diagnostic checks
    - godot         # comment sentences must end with a period
    - misspell      # spelling mistakes in identifiers, strings, and comments
    - nakedret      # naked returns in functions longer than a threshold
    - nestif        # deeply nested if-else chains
    - noctx         # HTTP requests not passed a context.Context
    - nolintlint    # malformed or overly broad //nolint directives
    - predeclared   # shadowing of predeclared identifiers (len, error, …)
    - revive        # comprehensive drop-in replacement for golint
    - unconvert     # unnecessary type conversions
    - unparam       # function parameters that never vary across callers

  settings:
    depguard:
      # The level dependency rule of the Site -> Machine -> Instance hierarchy:
      # a higher level may import a lower level, never the reverse, and the
      # abstract event contract (platform/internal/events) is importable by
      # everyone and imports no level.
      #
      # Each rule denies the levels *above* the files it matches, so the rule is
      # structural: it is keyed on directory, applies to packages that do not
      # exist yet, and covers _test.go files, which .go-arch-lint.yml excludes by
      # configuration. go-arch-lint remains the per-package allow-list — the two
      # answer different questions, and its "not attached to any component"
      # error is what catches a new package nobody has classified.
      #
      # platform/internal/app and platform/internal/httpapi have no rule on
      # purpose. app is the composition root, where publishers, stores, and
      # consumers of all three levels are wired together, and httpapi is the
      # HTTP edge. Both sit at no level, so neither can reverse one.
      #
      # "May import" is permission, not encouragement: site reaching into
      # machine internals should stay rare and deliberate, and the common shared
      # surface is platform/internal/events.
      rules:
        events-level:
          files:
            - "**/platform/internal/events/**"
          deny:
            - pkg: github.com/miroslav-matejovsky/opdl/platform/internal/instance
              desc: the abstract event contract owns no level and must stay importable by all of them
            - pkg: github.com/miroslav-matejovsky/opdl/platform/internal/machine
              desc: the abstract event contract owns no level and must stay importable by all of them
            - pkg: github.com/miroslav-matejovsky/opdl/platform/internal/site
              desc: the abstract event contract owns no level and must stay importable by all of them
        instance-level:
          files:
            - "**/platform/internal/instance/**"
          deny:
            - pkg: github.com/miroslav-matejovsky/opdl/platform/internal/machine
              desc: instance is below machine; publish a fact through platform/internal/events instead
            - pkg: github.com/miroslav-matejovsky/opdl/platform/internal/site
              desc: instance is below site; publish a fact through platform/internal/events instead
        machine-level:
          files:
            - "**/platform/internal/machine/**"
          deny:
            - pkg: github.com/miroslav-matejovsky/opdl/platform/internal/site
              desc: machine is below site; publish a fact through platform/internal/events instead
    exhaustive:
      default-signifies-exhaustive: true
    gocyclo:
      min-complexity: 20  # stricter than default 30
    goconst:
      ignore-tests: true
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        # Domain events are immutable facts passed by value on purpose (sealed
        # DomainEvent interface). hugeParam would force pointer receivers and
        # rangeValCopy would force index loops over the read-model rollups; both
        # fight the value-type design for no real gain, so they are disabled.
        - hugeParam
        - rangeValCopy
    godot:
      scope: declarations   # exported declarations only
    nakedret:
      max-func-lines: 30
    nestif:
      min-complexity: 5
    revive:
      rules:
        - name: context-as-argument
        - name: context-keys-type
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
        - name: if-return
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: var-declaration
    gosec:
      severity: medium
      confidence: medium
      excludes:
        - G404  # math/rand: not used for cryptographic purposes here

  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - legacy
    paths:
      - third_party$
      - builtin$
      - examples$

formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$